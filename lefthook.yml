pre-commit:
  parallel: false
  commands:
    biome:
      use_stdin: true
      run: |
        FILES=$(git diff --name-only --cached)

        if [ -z "$FILES" ]; then
          exit 0
        fi

        echo "$FILES" \
          | grep -E '\.(ts|js|json)$' \
          | xargs -r pnpm dlx biome check --write

        git add $FILES

        pnpm run biome:check

pre-push:
  commands:
    validate:
      use_stdin: true
      run: |
        pnpm run biome:check

        OUTPUT=$(pnpm run typecheck 2>&1)
        STATUS=$?

        if [ $STATUS -ne 0 ]; then
          echo "$OUTPUT"
          exit $STATUS
        fi

        if [ -z "$OUTPUT" ]; then
          echo "Typecheck passed with no output."
          exit 0
        fi

        echo "$OUTPUT"

commit-msg:
  commands:
    commitlint:
      use_stdin: true
      run: pnpm dlx commitlint --edit {1}
